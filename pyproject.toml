[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barcode-pipeline"
version = "1.0.0"
description = "DNA-barcode identification and phylogeny pipeline for fungal and bacterial isolates"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ITS", "16S", "barcoding", "mycology", "phylogenetics", "Sanger", "IQ-TREE"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "biopython>=1.83",
  "pandas>=2.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pyfamsa>=0.5",
  "piqtree>=0.5",
  "dendropy>=5.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
barcode-pipeline = "barcode_pipeline.cli:main"
barcode-pipeline-web = "webapp.__main__:main"

[tool.setuptools]
packages = ["barcode_pipeline", "webapp"]

[tool.setuptools.package-data]
webapp = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
